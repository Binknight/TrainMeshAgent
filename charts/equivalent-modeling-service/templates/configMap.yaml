apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.app.name }}-configmap
data:
  # ── Flask（业务侧：SSE 对话流 + WebSocket 仿真状态） ──
  FLASK_HOST: {{ .Values.config.flaskHost | quote }}
  FLASK_PORT: {{ .Values.config.flaskPort | quote }}
  FLASK_DEBUG: {{ .Values.config.flaskDebug | quote }}
  FLASK_USE_RELOADER: {{ .Values.config.flaskUseReloader | quote }}
  SIM_POLL_INTERVAL: {{ .Values.config.simPollInterval | quote }}
  MCP_SERVER_URL: {{ .Values.config.mcpServerUrl | quote }}

  # ── MCP 仿真 Server ──
  AICM_MCP_HOST: {{ .Values.config.mcpHost | quote }}
  AICM_MCP_PORT: {{ .Values.config.mcpPort | quote }}
  AICM_MCP_SIM_TOOL_HOME: {{ .Values.config.simToolHome | quote }}
  AICM_MCP_CONDA_ENV: {{ .Values.config.condaEnv | quote }}
  # 与 deployment 中 sim-workspace 的 mountPath 同源，避免两处写歪
  AICM_MCP_WORKSPACE_ROOT: {{ .Values.workspace.containerPath | quote }}

  # ── 数据库（默认 SQLite）──
  # 数据文件路径与 database.containerPath 的挂载点同源，避免两处写歪
  # （SQLITE_PATH 的父目录必须落在容器内挂载目录里，否则库会落进镜像层）。
  SQLITE_PATH: {{ .Values.config.sqlitePath | quote }}

  # ── LLM ──
  OPENAI_BASE_URL: {{ .Values.config.openaiBaseUrl | quote }}
  OPENAI_MODEL: {{ .Values.config.openaiModel | quote }}
  OPENAI_SSL_VERIFY: {{ .Values.config.openaiSslVerify | quote }}

  # ── 明文密钥与可选覆盖（未配置时**整行不渲染**）──
  # 本 chart 不再创建 Secret（templates/secret.yaml 已删除），LLM API Key 以明文经
  # 本 ConfigMap 下发，理由与代价见 values.yaml 的 config.openaiApiKey 注释。
  #
  # 条件渲染是刻意保留的：Sprig 的 `quote` 遇到 nil 会返回空串，于是模板只剩
  # `KEY:`（YAML null），k8s 会以 unknown object type "nil" 直接拒绝发布 ——
  # 这正是历史上 OPENAI_API_KEY 把整条流水线卡失败的原因。空值必须表现为
  # 「键不存在」，而不是「键为空」。
  {{- if .Values.config.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.config.openaiApiKey | quote }}
  {{- end }}

  # 数据库逃生门（可选）：取消注释 values.yaml 的 config.databaseUrl 才下发；
  # 不填时完全沿用镜像内 ENV 的 DATABASE_URL（空串 = SQLite）。
  {{- if .Values.config.databaseUrl }}
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  {{- end }}

  # 出网代理（可选）：EXTERNAL_PROXY 由 app/config.py 读取（回退 LLM_PROXY）。
  {{- if .Values.config.externalProxy }}
  EXTERNAL_PROXY: {{ .Values.config.externalProxy | quote }}
  {{- end }}
