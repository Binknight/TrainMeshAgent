app:
  # 三处共用此值：k8s 资源名、镜像名（{{ repository }}/{{ name }}:{{ version }}）、
  # 节点日志目录名。必须与平台镜像仓库中本服务的镜像名保持一致。
  name: equivalent-modeling-service
  version: 1.0.0

images:
  repository: @repository@
  pullPolicy: IfNotPresent
  pullSecret: @pullSecret@
  # 平台注入的镜像 tag。**两层防护缺一不可**：
  #   1) 这里带引号（与 config 里 LLM 四个键同一约定）：纯文本替换后保持
  #      YAML 字符串（如 "20261008092605"），不走数字形态。
  #   2) deployment.yaml 对**非字符串**再走 int64：值若以数字形态进 Helm，
  #      Helm 3 加载 values 会做 YAML->JSON 往返，纯数字会被解析成 float64，
  #      Go 模板按 %v 渲染大浮点数就是科学计数法
  #      （20261008092605 -> 2.0261008092605e+13），k8s 便去拉不存在的 tag。
  #      实测：只在第 1 层加引号并不够 —— 事故复现时私有仓里 tag 是对的
  #      （20261008092605），部署出来仍是 2.0261008092605e+13，说明值是
  #      以数字形态进模板的，只能靠模板侧归一化兜住。
  # 注：源服务模板写的是 {{ int .Values.images.version }}，靠 int 归一化纯数字
  # 构建号，这正是兄弟服务 tag 正常的原因；但 Sprig 的 int 对 1.0.0 /
  # 1.0.0.20250920 这类带点版本会静默得到 0（直接 ImagePullBackOff），
  # 所以本 chart 改为按类型分支：数字 -> int64，字符串 -> 原样。
  # render_chart.py 有断言把守（数字形态不得渲染出科学计数法）。
  version: "@version@"

domain: @domain@

eks:
  clusterId: @eks.clusterId@

# 服务暴露方式。原为 ClusterIP（仅集群内可达，靠平台网关/domain 转发），
# 现改为 NodePort：集群外可经 <节点IP>:<nodePort> 直接访问 Flask。
# 注意：本服务的 Pod 受 node.firewall/enabled 节点亲和限制，NodePort 只在这些
# 节点上监听 —— 访问要用实际调度到的节点 IP，且端口需在防火墙放行范围内。
service:
  # NodePort / ClusterIP。改回 ClusterIP 即回到「只经平台网关暴露」的原形态，
  # 不需要改模板。
  type: NodePort
  # 固定 nodePort（k8s 默认范围 30000-32767）。留空 = 由 k8s 自动分配。
  # 留空时模板整行不渲染 —— 不能下发空值：`nodePort:`（冒号后无值）会被解析成
  # YAML null，k8s 以 cannot unmarshal 拒绝发布（与 2026-09-30 那次 OPENAI_API_KEY
  # 的 nil 事故同一类）。端口是**节点级**资源，同一节点上不能与其他 Service 冲突。
  nodePort: ""

deployment:
  # 必须为 1，两个独立原因：
  #   1. 仿真工作区是节点本地 hostPath，且 MCP 的 task_store 是进程内内存态，
  #      多副本会调度到不同节点、互相查不到对方的 task_id（TaskNotFound）。
  #   2. 数据库（默认 SQLite）同样是**单写者**：数据文件在节点本地 hostPath 上，
  #      两个 Pod 同时打开同一 WAL 库会互相干扰甚至损坏数据。
  #      DB 目录**绝不能**换成 NFS —— SQLite 依赖本地文件锁（POSIX advisory
  #      lock）与 fsync 语义，NFS 上的锁语义不可靠，会导致数据损坏。
  replicas: 1

resources:
  # 本 Pod 同时承载 Flask(SSE/WebSocket) + MCP 仿真 Server + run.py 仿真子进程，
  # 仿真本身吃 CPU/内存，故取最大档；若平台允许自定义，仿真密集时建议再上调。
  cpuWeight: l
  memoryWeight: l

# 仿真任务工作区：每个 task 一个子目录，内含
#   task_meta.json / topology_generated.sh / simulation.log / results/
# 直接落在部署节点本地磁盘，容器重建、镜像升级都不会丢产物。
# 容器内数据路径统一在 /home/data 下（**刻意**不放在 /home/aicm —— 那是仿真工具
# 目录，同名会被整目录挂载遮掉工具代码）：workspace → /home/data/workspace，
# db → /home/data/db。镜像内也已预建该挂载点（见 Dockerfile）。
workspace:
  nodePath: /data/aicm/workspace
  containerPath: /home/data/workspace

# 数据库目录（默认后端 SQLite）。
# 与 workspace 统一：容器内都是 /home/data 下的子目录。
# 数据文件是 containerPath 下的 equivalent_modeling_service.db（另有 -wal / -shm 伴生文件）。
# 节点侧给独立目录，与仿真工作区物理分离：升级/清理 workspace 时不会误伤数据库。
# 由 initContainer chown 1000:1000（hostPath 的属主镜像管不到，见 deployment.yaml）。
# 注意：这是节点本地目录，Pod 漂移到别的节点会看到一个「空」数据库
# （与 workspace 同源的失效模式）。要跨节点保留数据必须换持久卷方案，
# 但**不能**用 NFS —— SQLite 不支持网络文件系统上的可靠锁。
database:
  nodePath: /data/aicm/db
  containerPath: /home/data/db

log:
  # 平台日志采集约定（ecslog-agent）。本服务日志走 stdout，此卷仅为对齐平台规范，
  # 如本服务所在项目的日志前缀不同，请改 nodePrefix 或按需删除该卷。
  containerDir: /home/virtualemulation/log
  nodePrefix: /data01/log/ekslog/com.huawei.devicetestbmc/pro_biz_rnd_01

# ── 运行期配置 → ConfigMap → envFrom ──
# 注意：本服务读取的是「环境变量」，不是配置文件，因此不再挂 /home/config/。
# 其余未列出的键沿用镜像内 ENV（见 Dockerfile ENV 段），无需重复声明。
# 本 chart **不再创建 Secret**（templates/secret.yaml 已删除）：LLM 的四个键
# （含 API Key）改为由**平台变量**注入，见下方 LLM 段。
config:
  # Flask 业务侧
  flaskHost: "0.0.0.0"
  flaskPort: "5000"
  flaskDebug: "false"
  flaskUseReloader: "false"
  simPollInterval: "1.0"
  # 同容器内两个进程，走回环地址；不要写成 Service 名
  mcpServerUrl: "http://127.0.0.1:9000"
  # MCP 仿真 Server
  mcpHost: "0.0.0.0"
  mcpPort: "9000"
  # 仿真工具本体目录（镜像层内，保持 /home/aicm 不变）。
  # 与 Dockerfile ENV AICM_MCP_SIM_TOOL_HOME 保持一致。数据挂载树已移到
  # /home/data（workspace/db），工具目录不再与任何挂载路径同名，整目录挂载
  # 也不会把镜像层里的工具代码遮掉（工具不用被迫落到宿主机）。
  simToolHome: "/home/aicm"
  # 数据库文件路径（默认后端 SQLite）。父目录与 database.containerPath 同源，
  # 便于 verify_consistency.py 断言「配置的路径确实落在挂载目录内」。
  sqlitePath: "/home/data/db/equivalent_modeling_service.db"
  # 必须为空串：conda_launcher 在 conda_env 为空时回退为当前解释器，免装 conda
  condaEnv: ""
  # ── LLM（四个值全部由平台变量注入，占位符即变量名）──
  # 流水线按占位符里的名字去 params.props（= 部署脚本里 `env` 的导出）取值，因此
  # 平台侧必须以**完全一致**的名字登记这四个变量：
  #   config.openaiBaseUrl / config.openaiModel / config.openaiSslVerify / config.openaiApiKey
  # （点号是名字的一部分，与既有的 eks.clusterId、nfs.server 是同一套机制。）
  #
  # 未登记时占位符会被替换成**空串**，这正是 2026-09-30 那次发布失败的成因：
  # 空串 → values 里该键为 YAML null → Sprig 的 quote(nil) 返回空串（不是 "None"）
  # → 渲染出 `OPENAI_XXX:`（无值）→ k8s 以 unknown object type "nil" 拒绝整次发布。
  # 因此 configMap.yaml 对这四个键**全部条件渲染**：空值 = 整行不渲染 =
  # 回退 app/config.py 的默认值（https://api.openai.com/v1 / gpt-4o / true），
  # 绝不会再渲染出 nil。这是硬要求，不是风格问题。
  #
  # 副作用（需要知道）：变量没登记时发布照样成功，但
  #   - baseUrl / model / sslVerify：静默使用 app/config.py 的默认值；
  #   - openaiApiKey：ConfigMap 里就没有 OPENAI_API_KEY，首次 LLM 调用才报鉴权失败。
  # 发布后自检：`kubectl get cm equivalent-modeling-service-configmap -o yaml`
  # 看这四个键是否都在。
  #
  # 占位符**必须带引号**：流水线做的是纯文本 sed 替换，写成不带引号的
  # `openaiSslVerify: @config.openaiSslVerify@` 时，平台给 `false` 会得到 YAML 的
  # **布尔** false → `{{- if }}` 判假 → 该键被静默丢弃（想关 SSL 结果仍是默认的
  # true）。带引号可保证替换结果始终是字符串，也顺便避开把纯数字/日期形态的值
  # 解析成其他类型。render_chart.py 有断言把守这一点。
  openaiBaseUrl: "@config.openaiBaseUrl@"
  openaiModel: "@config.openaiModel@"
  openaiSslVerify: "@config.openaiSslVerify@"
  openaiApiKey: "@config.openaiApiKey@"
  # 外部 PostgreSQL 逃生门（可选，明文）。取消注释并填入**真实 DSN** 即切回外部 PG：
  # 同一镜像、无需重建。注意前缀必须是 postgres:// 或 postgresql://，写成别的
  # （例如 postgres:/）会被静默判定为 SQLite（见 app/dbapi.detect_backend）。
  # 刻意用注释 + 字面示例，**不登记任何 @...@ 占位符**：未登记的占位符会被流水线
  # 原样下发成字符串。
  # databaseUrl: "postgresql://user:pass@10.x.x.x:5432/equivalent_modeling_service"
  # 出网代理（可选，明文）：填了才下发 EXTERNAL_PROXY（app/config.py 读取，回退 LLM_PROXY）。
  # externalProxy: "http://proxy.example.com:8080"

# 当前工作区走节点本地 hostPath（见 workspace）。若将来需要多副本/跨节点共享，
# 可把 deployment 中的 sim-workspace 卷换成本 NFS（rwx）方案，server 由平台注入。
nfs:
  server: @nfs.server@
