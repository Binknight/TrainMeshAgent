apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.name }}-secret
type: Opaque
stringData:
  # DATABASE_URL 可选：不设置时沿用镜像内默认值，即连本容器内嵌的 PostgreSQL
  #   postgresql://postgres@/train_mesh_agent?host=/home/aicm/db/run
  # 这里刻意用条件渲染而不是渲染成空串：空串会**覆盖**镜像 ENV，
  # 导致 wait_for_db 里的空 DSN 判定走到默认值分支或直接报错。
  # 需要回到「外部 PostgreSQL」时，在 values.yaml 里补
  #   secrets.databaseUrl: "postgresql://user:pass@host:5432/train_mesh_agent"
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
