apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.name }}-secret
type: Opaque
stringData:
  # DATABASE_URL 可选：不设置时沿用镜像内默认值（空串），即使用本容器内的
  # **SQLite**（数据文件 /home/aicm/db/train_mesh_agent.db）。
  # 这里刻意用条件渲染而不是渲染成空串：空串会**覆盖**镜像 ENV，虽然当前两者
  # 语义相同（都表示走 SQLite），但把「未配置」表达成显式空值是多余的歧义。
  # 需要改用「外部 PostgreSQL」时，在 values.yaml 里补
  #   secrets.databaseUrl: "postgresql://user:pass@host:5432/train_mesh_agent"
  # 后端由 DSN 前缀（postgres:// / postgresql://）自动侦测，无需其他开关。
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
